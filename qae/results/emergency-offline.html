:root{
  --navy:#0B1B4F; --navy-2:#1D4ED8; --navy-soft:#EDF1F7; --navy-50:#F5F8FD;
  --gold:#10B981; --gold-deep:#0F766E; --gold-soft:#ECFDF5;
  --bg:#F5F8FD; --card:#FFFFFF; --border:#E2E9F4; --text:#101A30; --muted:#64748B;
  --ok:#16A34A; --ok-soft:#EAF7EF; --warn:#EA580C; --warn-soft:#FEF2EC;
  --bad:#DC2626; --bad-soft:#FDECEC; --amber:#B45309; --amber-soft:#FFF8E8;
  --r:16px; --r-sm:12px;
  --shadow:0 10px 24px -14px rgba(11,27,79,.22);
  --shadow-sm:0 4px 14px -8px rgba(11,27,79,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif; font-size:15px; line-height:1.6;}
button{font-family:inherit;}
::selection{background:rgba(11,27,79,.18);}
.mono{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:embed;}
.hidden{display:none !important;}
.dim{opacity:.55;}

/* ===== الهيدر ===== */
.nk-top{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.nk-top-in{max-width:1080px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px;}
.nk-logo{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-sm);object-fit:contain;padding:4px;}
.nk-top-txt{min-width:0;flex:1;}
.nk-top-txt b{display:block;font-size:15px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nk-top-txt span{display:block;font-size:11px;font-weight:700;color:var(--gold-deep);letter-spacing:.4px;}
.nk-emg-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;font-size:11px;font-weight:800;padding:6px 12px;border-radius:999px;box-shadow:inset 0 -2px 0 rgba(16,185,129,.55);white-space:nowrap;}
.nk-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:nkpulse 1.8s infinite;}
@keyframes nkpulse{0%,100%{opacity:.5}50%{opacity:1}}
.nk-days{font-size:11px;font-weight:800;color:var(--muted);text-align:center;line-height:1.3;white-space:nowrap;}
.nk-days b{display:block;color:var(--navy);font-size:15px;}

/* ===== شريط التحذير ===== */
.nk-warn{background:linear-gradient(90deg,#FFF8E8,#ECFDF5);border-block:1px solid #EEDFB8;color:var(--amber);}
.nk-warn-in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:700;}
.nk-warn svg{width:15px;height:15px;flex-shrink:0;margin-top:3px;color:var(--gold-deep);}

/* ===== التنقل ===== */
.nk-tabs{position:sticky;top:57px;z-index:30;background:rgba(245,247,250,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.nk-tabs-in{max-width:1080px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto;}
.nk-tab{flex:1;min-width:86px;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:8px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;position:relative;transition:all .15s;}
.nk-tab svg{width:20px;height:20px;}
.nk-tab:hover{background:#fff;color:var(--navy);}
.nk-tab.on{background:#fff;border-color:var(--border);color:var(--navy);box-shadow:var(--shadow-sm);}
.nk-tab.on::after{content:"";position:absolute;bottom:-1px;inset-inline:14px;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--gold),var(--navy));}
.nk-tab[disabled]{opacity:.4;pointer-events:none;}

/* ===== الحاوية ===== */
.nk-main{max-width:1080px;margin:0 auto;padding:16px 16px 96px;}
.nk-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:16px;}
.nk-card.brand{position:relative;overflow:hidden;}
.nk-card.brand::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--navy) 60%);}
.nk-sec-title{font-size:16px;font-weight:800;color:var(--navy);margin:0 0 4px;}
.nk-sec-sub{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 12px;}
.nk-gate{width:64px;height:5px;border-radius:4px;background:linear-gradient(90deg,var(--gold) 0 38%,var(--navy) 38% 100%);margin:6px 0 14px;}

/* ===== شبكة الإحصائيات ===== */
.nk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.nk-stat{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:var(--r);color:#fff;padding:14px;position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:84px;}
.nk-stat::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--gold);}
.nk-stat .v{font-size:22px;font-weight:800;line-height:1.2;}
.nk-stat .l{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);margin-top:2px;}
.nk-stat.ghost{background:#fff;color:var(--navy);border:1px solid var(--border);box-shadow:none;}
.nk-stat.ghost::after{background:var(--navy-soft);}
.nk-stat.ghost .l{color:var(--muted);}

/* ===== الأزرار ===== */
.nk-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:#fff;color:var(--navy);font-weight:800;font-size:14px;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;transition:all .15s;min-height:44px;}
.nk-btn:hover{box-shadow:var(--shadow-sm);border-color:color-mix(in srgb,var(--navy) 30%,#fff);}
.nk-btn:active{transform:scale(.985);}
.nk-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.nk-btn svg{width:18px;height:18px;}
.nk-btn.primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent;box-shadow:inset 0 -3px 0 rgba(16,185,129,.45),var(--shadow);border:1px solid transparent;}
.nk-btn.primary:hover{filter:brightness(1.07);}
.nk-btn.gold{background:linear-gradient(135deg,var(--gold),#C08F27);color:#fff;border-color:transparent;box-shadow:inset 0 -3px 0 rgba(11,27,79,.4),var(--shadow);}
.nk-btn.ghost-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,#fff);background:var(--ok-soft);}
.nk-btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,#fff);background:var(--bad-soft);}
.nk-btn.sm{min-height:36px;padding:6px 12px;font-size:12px;border-radius:10px;}
.nk-btn.sm svg{width:15px;height:15px;}
.nk-btn.wide{width:100%;}

/* ===== البحث ===== */
.nk-search{display:flex;gap:8px;align-items:center;}
.nk-input{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;font-family:inherit;font-size:16px;font-weight:700;color:var(--text);background:#fff;min-height:48px;outline:none;transition:border .15s, box-shadow .15s;}
.nk-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,27,79,.12);}
.nk-input::placeholder{color:#9CA8B5;font-weight:600;}
textarea.nk-input{min-height:70px;resize:vertical;}
.nk-chip{display:inline-flex;align-items:center;gap:4px;background:var(--navy-soft);color:var(--navy);border:1px solid color-mix(in srgb,var(--navy) 18%,#fff);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;}
.nk-chip:hover{background:#fff;box-shadow:var(--shadow-sm);}
.nk-chip.gold{background:var(--gold-soft);color:var(--gold-deep);border-color:#EBD9AC;}
.nk-hint{font-size:11.5px;color:var(--muted);font-weight:700;}

/* ===== نتايج البحث ===== */
.nk-results{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.nk-res{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;transition:all .12s;text-align:start;width:100%;}
.nk-res:hover{border-color:var(--navy);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.nk-res .av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;}
.nk-res .nm{flex:1;min-width:0;}
.nk-res .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nk-res .nm span{font-size:11px;color:var(--muted);font-weight:700;}
.nk-bal{font-weight:800;font-size:14px;white-space:nowrap;}
.nk-bal.pos{color:var(--ok);} .nk-bal.neg{color:var(--warn);} .nk-bal.zero{color:var(--muted);}

/* ===== المودال ===== */
.nk-modal-bg{position:fixed;inset:0;background:rgba(20,32,53,.45);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:nkfade .18s ease;}
@keyframes nkfade{from{opacity:0}to{opacity:1}}
.nk-modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;box-shadow:0 -12px 48px rgba(11,27,79,.35);animation:nkslide .22s cubic-bezier(.2,.8,.2,1);padding:0;}
@keyframes nkslide{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:640px){
  .nk-modal-bg{align-items:center;padding:24px;}
  .nk-modal{border-radius:22px;max-height:86vh;}
}
.nk-modal-head{position:sticky;top:0;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;z-index:5;}
.nk-modal-head .tt{flex:1;min-width:0;}
.nk-modal-head .tt b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nk-modal-head .tt span{font-size:12px;color:rgba(255,255,255,.75);font-weight:700;}
.nk-modal-head .x{background:rgba(255,255,255,.14);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;}
.nk-modal-body{padding:16px;}

/* ===== صفوف المعلومات ===== */
.nk-kv{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--border);font-size:13px;}
.nk-kv:last-child{border-bottom:none;}
.nk-kv .k{color:var(--muted);font-weight:700;}
.nk-kv .v{font-weight:800;text-align:end;}

/* ===== البادجات ===== */
.nk-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;}
.nk-badge.g{background:var(--ok-soft);color:var(--ok);} .nk-badge.o{background:var(--warn-soft);color:var(--warn);}
.nk-badge.n{background:var(--navy-soft);color:var(--navy);} .nk-badge.r{background:var(--bad-soft);color:var(--bad);}
.nk-badge.a{background:var(--amber-soft);color:var(--amber);} .nk-badge.m{background:#EEF2F6;color:var(--muted);}
.nk-badge.gold{background:var(--gold-soft);color:var(--gold-deep);}

/* ===== الجداول ===== */
.nk-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;}
table.nk-tb{width:100%;border-collapse:collapse;min-width:560px;font-size:13px;}
.nk-tb thead th{background:var(--navy-soft);color:var(--navy);font-weight:800;padding:9px 10px;text-align:start;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.nk-tb tbody td{padding:9px 10px;border-bottom:1px solid var(--border);font-weight:700;}
.nk-tb tbody tr:last-child td{border-bottom:none;}
.nk-tb tbody tr:hover{background:#FAFBFD;}
.nk-tb .num{direction:ltr;text-align:end;font-variant-numeric:tabular-nums;}

/* ===== شريط الأيام ===== */
.nk-days-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;}
.nk-day{min-width:74px;background:#fff;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:8px 6px;text-align:center;cursor:pointer;flex-shrink:0;transition:all .12s;}
.nk-day b{display:block;font-size:13px;font-weight:800;color:var(--text);}
.nk-day span{font-size:10.5px;color:var(--muted);font-weight:700;}
.nk-day.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:var(--shadow-sm);}
.nk-day.on b,.nk-day.on span{color:#fff;}
.nk-day.today{border-color:var(--gold);}

/* ===== الحصص ===== */
.nk-ses{background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;display:flex;align-items:center;gap:10px;}
.nk-ses .tm{background:var(--navy-soft);color:var(--navy);border-radius:10px;padding:8px 6px;text-align:center;min-width:64px;font-weight:800;font-size:13px;line-height:1.3;}
.nk-ses .tm small{display:block;font-size:10px;font-weight:700;opacity:.7;}
.nk-ses .info{flex:1;min-width:0;}
.nk-ses .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nk-ses .info span{font-size:11.5px;color:var(--muted);font-weight:700;}
.nk-ses.live{border-color:color-mix(in srgb,var(--ok) 45%,#fff);background:linear-gradient(90deg,var(--ok-soft),#fff 60%);}

/* ===== العمليات (سجل) ===== */
.nk-txn{display:flex;gap:10px;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;align-items:flex-start;}
.nk-txn .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:15px;}
.nk-txn .bd{flex:1;min-width:0;}
.nk-txn .bd b{font-size:13px;}
.nk-txn .bd .sub{font-size:11px;color:var(--muted);font-weight:700;word-wrap:break-word;}

/* ===== شاشات الحالة ===== */
.nk-boot{min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:24px;}
.nk-boot-card{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:32px;text-align:center;max-width:420px;width:100%;}
.nk-boot-logo{width:76px;height:76px;margin:0 auto 12px;border-radius:20px;background:#fff;border:1px solid var(--border);padding:8px;object-fit:contain;}
.nk-spin{width:34px;height:34px;margin:14px auto;border:3.5px solid var(--navy-soft);border-top-color:var(--navy);border-radius:50%;animation:nkrot .8s linear infinite;}
@keyframes nkrot{to{transform:rotate(360deg)}}
.nk-status-hero{border-radius:20px;padding:20px;text-align:center;}
.nk-status-hero.bad{background:var(--bad-soft);border:1.5px solid #F3C1C1;}
.nk-status-hero.warn{background:var(--amber-soft);border:1.5px solid #EBD9AC;}
.nk-status-hero.ok{background:var(--ok-soft);border:1.5px solid #C8E9D4;}

/* ===== التصدير ===== */
.nk-export-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--r);padding:16px;background:#fff;}
.nk-export-card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;}
.nk-flow{display:flex;flex-direction:column;gap:0;align-items:center;margin:14px 0;}
.nk-flow .step{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:800;box-shadow:var(--shadow-sm);z-index:1;}
.nk-flow .step .n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;display:grid;place-items:center;font-size:12px;box-shadow:inset 0 -2px 0 rgba(16,185,129,.5);}
.nk-flow .arrow{width:2.5px;height:22px;background:linear-gradient(var(--gold),var(--navy));border-radius:2px;}

/* ===== تاب سفلي للموبايل ===== */
@media(max-width:719px){
  .nk-tabs{display:none;}
  .nk-bnav{display:flex !important;}
  .nk-main{padding-bottom:110px;}
}
.nk-bnav{display:none;position:fixed;bottom:0;inset-inline:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
.nk-bnav-in{max-width:560px;margin:0 auto;display:flex;}
.nk-bnav .nk-tab{flex:1;min-width:0;padding:7px 4px 5px;font-size:10.5px;}

/* ===== متنوع ===== */
.nk-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.nk-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.nk-subttl{font-size:13px;font-weight:800;color:var(--navy);margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
.nk-subttl::after{content:"";flex:1;height:1px;background:var(--border);}
.nk-empty{text-align:center;padding:26px 14px;color:var(--muted);font-weight:700;font-size:13px;}
.nk-empty .big{font-size:34px;margin-bottom:6px;}
.nk-toast{position:fixed;bottom:76px;inset-inline:0;display:flex;justify-content:center;z-index:90;pointer-events:none;}
.nk-toast-in{background:var(--navy);color:#fff;font-weight:800;font-size:13px;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);animation:nktoast .25s ease;max-width:90vw;text-align:center;}
@keyframes nktoast{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nk-toast-in.err{background:var(--bad);} .nk-toast-in.ok{background:var(--ok);}
.nk-scan{position:fixed;inset:0;background:#0B1526;z-index:80;display:flex;flex-direction:column;}
.nk-scan video{flex:1;object-fit:cover;width:100%;}
.nk-scan-bar{position:absolute;inset-inline:15%;top:34%;height:3px;background:var(--gold);border-radius:3px;box-shadow:0 0 18px rgba(16,185,129,.9);animation:nkscan 2.2s ease-in-out infinite;}
@keyframes nkscan{0%,100%{top:30%}50%{top:62%}}
.nk-scan-ui{padding:14px;display:flex;gap:10px;background:rgba(11,21,38,.85);backdrop-filter:blur(6px);color:#fff;align-items:center;}
.nk-scan-title{flex:1;font-weight:800;font-size:14px;}
.nk-locked{background:var(--amber-soft);border:1.5px solid #EBD9AC;color:var(--amber);border-radius:var(--r-sm);padding:10px 14px;font-size:12.5px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.nk-ro-banner{background:linear-gradient(135deg,#7A1E1E,#9B2C2C);color:#fff;border-radius:var(--r);padding:16px;display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:13px;box-shadow:var(--shadow);margin-bottom:14px;}
.nk-ro-banner svg{flex-shrink:0;margin-top:2px;}
@media print{ .nk-top,.nk-tabs,.nk-bnav,.nk-warn{display:none;} }
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}


:root{ --navy:#0B1B4F; --navy-2:#2563EB; --navy-soft:color-mix(in srgb,#0B1B4F 9%,#ffffff); --navy-50:#F5F8FD; }
.nk-brand-grad{ background:linear-gradient(135deg,#0B1B4F,#2563EB); }

</style>

function workbookXml(){

function buildXlsx(d){
  var files = [];
  function addSheet(rows, opts){
    files.push({ name: "xl/worksheets/sheet" + (files.length + 1) + ".xml", data: strBytes(sheetXml(Object.assign({ rows: rows }, opts || {}))) });
  }
  var pad = function(v){ return v < 10 ? "0" + v : "" + v; };

    try { var t = new Date(iso); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes()); }
    catch (e) { return ""; }
  }

  // ===== 1) لوحة التقرير =====
  var rows = [];
  rows.push([cellS("ALNOKHBA MANAGEMENT — تقرير الطوارئ", 1, 1, 1)]);

  rows.push([cellS("اتصدّر: " + fmtDate(d.exportedAt), 9, 3, 1)]);
  rows.push([]);
  var kpiLabels = [
    ["إجمالي الطلاب", d.kpis.students],
    ["اشتراكات نشطة", d.kpis.subs],
    ["حصص اشتغلت", d.kpis.sessions],

    ["أرصدة مدينة (جنيه)", d.kpis.outstanding],
    ["مستحقات المدرسين (جنيه)", d.kpis.earnings],
    ["معاملات طوارئ", d.kpis.txns],
    ["حاجات متخطاة/مراجعة", d.kpis.notes],
  ];
  for (var k = 0; k < kpiLabels.length; k++) {
    rows.push([cellS(kpiLabels[k][0], 6, k + 5, 1), cellN(kpiLabels[k][1], 10, k + 5, 2)]);
  }
  rows.push([]);
  var pStart = rows.length + 2;
  rows.push(headerRow(["اليوم", "عدد الدفعات", "التحصيل (ج)"], 3, 1));
  for (var pd = 0; pd < d.byDay.length; pd++) {
    rows.push(dataRow([{ v: d.byDay[pd][0] }, { v: d.byDay[pd][1], n: true }, { v: d.byDay[pd][2] / 100, n: true }], rows.length + 1, pd % 2 === 1));
  }
  var pEnd = rows.length;
  rows.push(dataRow([{ v: "الإجمالي", s: 13 }, { v: "", s: 13 }, { v: "", s: 13 }], rows.length + 1, false));
  rows[rows.length - 1][1] = cellF("SUM(B" + pStart + ":B" + pEnd + ")", 13, rows.length, 2);
  rows[rows.length - 1][2] = cellF("SUM(C" + pStart + ":C" + pEnd + ")", 12, rows.length, 3);
  rows.push([cellS("الرخصة: " + d.licenseInfo, 9, rows.length + 1, 1)]);
  addSheet(rows, {
    merge: ["A1:B1", "A2:B2", "A3:B3"],
    cols: [34, 16],
    dataBar: { ref: "C" + pStart + ":C" + pEnd, color: NAVY },
  });

  // ===== صفحات البيانات =====
  function tableSheet(header, widths, dataRows, moneyCols, filter, freeze){
    var r = [];
    r.push(headerRow(header, 3, 1));
    for (var i = 0; i < dataRows.length; i++) {
      var cells = [];
      for (var c = 0; c < dataRows[i].length; c++) {
        var raw = dataRows[i][c];
        if (raw == null) { cells.push({ v: "" }); continue; }
        var isMoney = moneyCols.indexOf(c) >= 0;
        cells.push(isMoney ? { v: raw / 100, n: true } : { v: raw });
      }
      r.push(dataRow(cells, r.length + 1, i % 2 === 1));
    }
    if (dataRows.length === 0) r.push([cellS("(مفيش بيانات)", 9, 2, 1)]);
    addSheet(r, {
      freeze: freeze != null ? freeze : 1,
      filter: { from: "A", to: colLetter(header.length), freezeRow: 0, rows: r.length },
      cols: widths,
    });
    return r.length;
  }

  // 2) الطلاب
  tableSheet(["الكود", "الاسم", "الموبايل", "ولي الأمر", "المرحلة", "المجموعات", "الحالة", "الرصيد (ج)"],
    [10, 26, 15, 15, 18, 30, 12, 14], d.students, [7]);
  // 3) الاشتراكات
  tableSheet(["الطالب", "الكود", "المجموعة", "سعر الحصة (ج)", "حصص اتعملت", "الرصيد الحالي (ج)", "الحالة"],
    [26, 10, 26, 14, 12, 16, 12], d.subs, [3, 5]);
  // 4) الحضور
  tableSheet(["التاريخ", "الحصة", "الطالب", "الكود", "الحالة", "الخصم (ج)", "الوقت", "مرجع العملية"],
    [12, 26, 26, 10, 12, 12, 18, 24], d.att, [5]);
  // 5) الدفعات
  tableSheet(["التاريخ", "الطالب", "الكود", "المبلغ (ج)", "الطريقة", "رصيد قبل (ج)", "رصيد بعد (ج)", "مرجع العملية"],
    [12, 26, 10, 14, 14, 14, 14, 24], d.pays, [3, 5, 6]);
  // 6) الحصص
  tableSheet(["التاريخ", "المجموعة", "المدرس", "الوقت", "القاعة", "الحالة", "حضور", "إيراد (ج)", "مرجع العملية"],
    [12, 26, 18, 14, 14, 12, 8, 14, 24], d.sess, [7]);
  // 7) مستحقات المدرسين
  tableSheet(["المدرس", "المجموعات", "مستحق اللقطة (ج)", "زي الطوارئ (ج)", "الإجمالي (ج)"],
    [26, 30, 16, 16, 16], d.earn, [2, 3, 4]);
  // 8) معاملات الطوارئ
  tableSheet(["#", "مرجع العملية", "النوع", "الكيان", "الفاعل", "الوقت", "المبلغ (ج)", "المجموع (تحقق)"],
    [6, 24, 20, 22, 16, 18, 14, 20], d.txns, [6]);
  // 9) ملاحظات الاستيراد
  tableSheet(["النوع", "التفاصيل", "المرجع"], [22, 50, 24], d.notes, []);
  // 10) معلومات التصدير
  var info = [];
  info.push(headerRow(["البند", "القيمة"], 3, 1));
  var infoRows = [
    ["المنتج", "ALNOKHBA MANAGEMENT — نظام الطوارئ"],
    ["السنتر", d.centerName],
    ["معرف السنتر", d.centerId],
    ["معرف الحزمة", d.packageId],
    ["معرف اللقطة", d.snapshotId],
    ["بداية الطوارئ", fmtDate(d.generatedAt)],
    ["انتهاء الصلاحية", fmtDate(d.expiresAt)],
    ["وقت التصدير", fmtDate(d.exportedAt)],
    ["بصمة اللقطة (SHA-256)", d.snapshotDigest],
    ["بصمة المفتاح", d.keyFp],
    ["إصدار التطبيق", d.appVersion],
    ["عدد المعاملات", d.kpis.txns],
    ["طريقة الاستيراد", "ارفع ملف الاسترداد (JSON) من: الطوارئ ← استيراد ملف الاسترداد"],
  ];
  for (var ir = 0; ir < infoRows.length; ir++) {
    info.push(dataRow([{ v: infoRows[ir][0], s: 6 }, { v: infoRows[ir][1] }], info.length + 1, ir % 2 === 1));
  }
  addSheet(info, { freeze: 1, filter: { from: "A", to: "B", freezeRow: 0, rows: info.length }, cols: [26, 46] });

  // ================= الحزمة النهائية =================
  files.unshift({ name: "[Content_Types].xml", data: strBytes(contentTypes()) });
  files.splice(1, 0, { name: "_rels/.rels", data: strBytes(rootRels()) });
  var wbIndex = 2;
  files.splice(wbIndex, 0, { name: "xl/workbook.xml", data: strBytes(workbookXml()) });
  files.splice(wbIndex + 1, 0, { name: "xl/_rels/workbook.xml.rels", data: strBytes(workbookRels()) });
  files.splice(wbIndex + 2, 0, { name: "xl/styles.xml", data: strBytes(stylesXml()) });
  // إعادة ترتيب: sheet names لازم تتطابق مع الترتيب — اتحلت بإنشاء sheets قبل الإضافة
  return makeZip(files);
}

// تصدير
window.NKEX = { buildXlsx: buildXlsx, crc32: crc32, makeZip: makeZip };
})();

<script>
// ================= ALNOKHBA MANAGEMENT — EMERGENCY MODE =================
"use strict";

var TAGS = { license: "nk-license-raw", snapshot: "nk-snapshot-raw", meta: "nk-meta" };
function textOf(id) {
  var el = document.getElementById(id);
  if (!el) return "";
  return (el.textContent || "").trim();
}
function b64ToBuf(b64) {
  var bin = atob(b64);
  var buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}
function hexOf(buf) {
  var arr = new Uint8Array(buf);
  var s = "";
  for (var i = 0; i < arr.length; i++) s += (arr[i] < 16 ? "0" : "") + arr[i].toString(16);
  return s;
}
function encUtf8(s) { return new TextEncoder().encode(s); }
function canonical(v) {
  var sort = function (x) {
    if (Array.isArray(x)) return x.map(sort);
    if (x && typeof x === "object") {
      var keys = Object.keys(x).sort();
      var o = {};
      for (var i = 0; i < keys.length; i++) o[keys[i]] = sort(x[keys[i]]);
      return o;
    }
    return x;
  };
  return JSON.stringify(sort(v));
}
async function sha256Hex(s) {
  var d = await crypto.subtle.digest("SHA-256", encUtf8(s));
  return hexOf(d);
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  // fallback RFC4122 v4
  var b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  var h = [];
  for (var i = 0; i < 16; i++) h.push((b[i] < 16 ? "0" : "") + b[i].toString(16));
  return h.slice(0, 4).join("") + "-" + h.slice(4, 6).join("") + "-" + h.slice(6, 8).join("") + "-" + h.slice(8, 10).join("") + "-" + h.slice(10, 16).join("");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }

// ================= الحالة العامة =================
var ST = {
  license: null, licenseRaw: "", snap: null,
  students: [], studentsById: {},
  groups: [], groupsById: {},
  teachers: [], teachersById: {},
  grades: [], gradesById: {},
  subjects: [], subjectsById: {},
  rooms: [], staff: [], schedule: [],
  sessions: [], sessionsById: {},
  att: {},            // "sessionId|studentId" -> سجل حضور
  balances: {},       // studentId -> piastres
  txns: [],           // معاملات الطوارئ ETX
  notes: [],          // ملاحظات/تحذيرات للتصدير
  actor: null,        // {id, name, role}
  seq: 0,
  expired: false, expiredReason: "",
  daysLeft: 0, effNow: 0,
  view: "dash",
  sessionDate: null,  // التاريخ المختار في صفحة الحصص
  booted: false,
};
var CLK = { off: 0 }; // إزاحة معملية لمحاكاة التلاعب بالساعة (اختبارات)
function clockNow() { return Date.now() + CLK.off; }

// ================= الفلوس (قروش — أرقام صحيحة دايمًا) =================
function egp(piastres) {
  var v = (piastres || 0) / 100;
  return (Math.round(v * 100) / 100).toFixed(2);
}
function egpSigned(piastres) {
  var p = piastres || 0;
  return (p > 0 ? "+" : "") + egp(p);
}
function amountDueToday(price, balance) {
  // نفس معادلة النظام الأساسي بالظبط (finance.ts)
  return Math.max(price - Math.max(balance, 0) + Math.abs(Math.min(balance, 0)), 0);
}
function effectivePrice(student, groupId) {
  for (var i = 0; i < (student.regs || []).length; i++) {
    if (student.regs[i].groupId === groupId && student.regs[i].priceOverride != null) return student.regs[i].priceOverride;
  }
  var g = ST.groupsById[groupId];
  return g ? g.sessionPrice : 0;
}

// ================= التخزين (IndexedDB مع fallback) =================
var storage = { kind: "none" };
function openIDB() {
  return new Promise(function (resolve) {
    var req;
    try { req = indexedDB.open("nkemg-" + ST.license.packageId, 1); }
    catch (e) { return resolve(null); }
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, 4000);
    req.onupgradeneeded = function (ev) {
      var db = ev.target.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
    };
    req.onsuccess = function (ev) {
      if (done) return; done = true; clearTimeout(timer);
      var db = ev.target.result;
      resolve({
        kind: "idb",
        get: function (key) {
          return new Promise(function (res) {
            try {
              var tx = db.transaction("kv", "readonly").objectStore("kv").get(key);
              tx.onsuccess = function () { res(tx.result != null ? tx.result.value : null); };
              tx.onerror = function () { res(null); };
            } catch (e) { res(null); }
          });
        },
        set: function (key, value) {
          return new Promise(function (res) {
            try {
              var tx = db.transaction("kv", "readwrite").objectStore("kv").put({ key: key, value: value });
              tx.onsuccess = function () { res(true); };
              tx.onerror = function () { res(false); };
            } catch (e) { res(false); }
          });
        },
      });
    };
    req.onerror = function () { if (!done) { done = true; clearTimeout(timer); resolve(null); } };
    req.onblocked = function () { if (!done) { done = true; clearTimeout(timer); resolve(null); } };
  });
}
function makeLS() {
  var prefix = "nkemg-" + ST.license.packageId + ":";
  return {
    kind: "ls",
    get: function (key) {
      try { var v = localStorage.getItem(prefix + key); return v == null ? null : JSON.parse(v); }
      catch (e) { return null; }
    },
    set: function (key, value) {
      try { localStorage.setItem(prefix + key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    },
  };
}
// نسخة احتياطية من سجل الاستخدام في localStorage دايمًا (ضد مسح IDB)
function usageBackup(v) {
  try { localStorage.setItem("nkemg-usage-" + ST.license.packageId, JSON.stringify(v)); } catch (e) {}
}
function usageBackupRead() {
  try { var v = localStorage.getItem("nkemg-usage-" + ST.license.packageId); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}

// ================= سجل الاستخدام + منع التلاعب بالساعة =================
var USAGE = { wallHigh: 0, activeMs: 0, firstOpen: 0, bootCount: 0, lastBeat: 0 };
function effectiveNow() {
  var issued = new Date(ST.license.issuedAt).getTime();
  var byWall = USAGE.wallHigh || 0;
  var byActive = issued + (USAGE.activeMs || 0);
  return Math.max(clockNow(), byWall, byActive);
}
async function beatHeart(first) {
  var now = clockNow();
  if (first) {
    USAGE.firstOpen = USAGE.firstOpen || now;
    USAGE.bootCount = (USAGE.bootCount || 0) + 1;
    USAGE.lastBeat = now;
  } else if (USAGE.lastBeat) {
    var delta = now - USAGE.lastBeat;
    if (delta > 0 && delta < 120000) USAGE.activeMs = (USAGE.activeMs || 0) + delta; // حد أقصى دقيقتين للنبضة
    USAGE.lastBeat = now;
  }
  USAGE.wallHigh = Math.max(USAGE.wallHigh || 0, now);
  usageBackup(USAGE);
  await storage.set("usage", USAGE);
}
function evalExpiry() {
  ST.effNow = effectiveNow();
  var exp = new Date(ST.license.expiresAt).getTime();
  var issued = new Date(ST.license.issuedAt).getTime();
  ST.expired = ST.effNow >= exp || ST.effNow < issued - 6 * 3600 * 1000;
  ST.daysLeft = Math.max(0, Math.ceil((exp - ST.effNow) / 86400000));
}

// ================= التحقق من الرخصة والتوقيع =================
async function verifyBoot(meta) {
  if (!window.crypto || !crypto.subtle) return { ok: false, reason: "المتصفح ده مش بيدعم التحقق الأمني (WebCrypto) — افتح الملف بمتصفح حديث." };
  try {
    var key = await crypto.subtle.importKey("spki", b64ToBuf(meta.publicKey), { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["verify"]);
    var sigOk = await crypto.subtle.verify("RSASSA-PKCS1-v1_5", key, b64ToBuf(meta.signature), encUtf8(ST.licenseRaw));
    if (!sigOk) return { ok: false, reason: "توقيع الرخصة مش صحيح — الملف اتعدّل أو مش موقّع من سيرفر AlNokhba Management." };
    var digest = await sha256Hex(textOf(TAGS.snapshot));
    if (digest !== ST.license.snapshotDigest) return { ok: false, reason: "بيانات اللقطة مش مطابقة للبصمة الموقّعة — الملف اتعدّل بعد التوليد." };
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: "فشل التحقق الأمني: " + (e && e.message ? e.message : e) };
  }
}

// ================= أدوات الواجهة =================
function el(tag, cls, html) {

}
function icon(name, size) {

    sessions: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',

  var input = document.getElementById("nk-q");

    if (hits.length === 0) {
      results.innerHTML = '<div class="nk-empty"><div class="big">🔍</div>مفيش طالب بالبيانات دي</div>';
      return;
    }
    for (var i = 0; i < hits.length; i++) results.appendChild(resultRow(hits[i]));
  }
  input.oninput = function () { clearTimeout(timer); timer = setTimeout(run, 120); };
  input.onkeydown = function (ev) { if (ev.key === "Enter") { ev.preventDefault(); run(); } };
  var qrBtn = document.getElementById("nk-qr-btn");

function searchStudents(q, limit) {
  q = normDigits(q).toLowerCase();
  var qd = q.replace(/[^0-9]/g, "");
  var scored = [];
  for (var i = 0; i < ST.students.length; i++) {
    var s = ST.students[i];
    var score = -1;
    if (s.qrToken && s.qrToken === q) score = 100;
    else if (qd.length >= 4 && s.code === qd) score = 95;
    else if (qd.length >= 7 && phoneTail(s.phone).endsWith(qd)) score = 90;
    else if (qd.length >= 7 && phoneTail(s.parentPhone).endsWith(qd)) score = 85;
    else if (s.name && normDigits(s.name).toLowerCase().indexOf(q) >= 0) score = 50;
    if (score < 0) continue;
    scored.push({ s: s, score: score });
  }
  scored.sort(function (a, b) { return b.score - a.score || a.s.name.localeCompare(b.s.name); });
  return scored.slice(0, limit || 30).map(function (x) { return x.s; });
}
function resultRow(s) {
  var bal = ST.balances[s.id] || 0;
  var balCls = bal > 0 ? "pos" : bal < 0 ? "neg" : "zero";

    '<span class="nk-bal ' + balCls + ' mono">' + egpSigned(bal) + " ج</span>"
  );

  return b;
}

function openScanner() {
  var root = document.getElementById("nk-scan-root");
  root.innerHTML =
    '<div class="nk-scan" id="nk-scan-box">' +
      '<div class="nk-scan-bar"></div>' +
      '<video id="nk-scan-video" playsinline muted></video>' +
      '<div class="nk-scan-ui">' +
        '<span style="width:34px;height:34px;border-radius:10px;background:rgba(16,185,129,.25);display:grid;place-items:center">' + icon("camera", 18) + "</span>" +
        '<span class="nk-scan-title">وجّه الكاميرا على كارت الطالب…</span>' +
        '<button class="nk-btn sm" id="nk-scan-close" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)">' + icon("x", 14) + " إقفال</button>" +
      "</div>" +
    "</div>";
  var video = document.getElementById("nk-scan-video");
  var stream = null, raf = 0, stopped = false;
  var canvas = document.createElement("canvas");
  var ctx = canvas.getContext("2d", { willReadFrequently: true });

  function stop() {
    stopped = true;
    cancelAnimationFrame(raf);
    if (stream) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} }
    root.innerHTML = "";
  }
  document.getElementById("nk-scan-close").onclick = stop;

  function tick() {
    if (stopped) return;
    try {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        if (canvas.width > 0) {
          ctx.drawImage(video, 0, 0);
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var code = null;
          try { code = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" }); } catch (e) {}
          if (code && code.data) {
            var token = String(code.data).trim();
            stop();
            var s = null;
            for (var i = 0; i < ST.students.length; i++) if (ST.students[i].qrToken === token) { s = ST.students[i]; break; }
            if (s) { toast("تم المسح: " + s.name, "ok"); openStudent(s.id); }
            else { toast("الكارت ده مش مسجّل في حزمة الطوارئ", "err"); go("search"); }
            return;
          }
        }
      }
    } catch (e) {}
    raf = requestAnimationFrame(tick);
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }).then(function (str) {
    if (stopped) { try { str.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} return; }
    stream = str;
    video.srcObject = str;
    video.setAttribute("playsinline", "true");
    video.play().catch(function () {});
    raf = requestAnimationFrame(tick);
  }).catch(function () {
    stop();
    toast("مش قادر أفتح الكاميرا — اتأكد من الصلاحية أو اكتب الكود بإيدك", "err");
  });
}

"use strict";

// ================= محرك معاملات الطوارئ (ETX) =================
var LOCK = { tabId: Math.random().toString(36).slice(2, 10) };
var bc = null;
var RECENT = {}; // بصمات العمليات الأخيرة — ضد الدبل-كليك

function addNote(type, details, ref) {
  ST.notes.push({ type: type, details: details, ref: ref || null, at: new Date(clockNow()).toISOString() });
  persistState();
}
async function withLock(fn) {
  var lock = await storage.get("lock");
  var now = clockNow();
  if (lock && lock.tab !== LOCK.tab && now - (lock.ts || 0) < 8000) {
    throw new Error("في تاب تاني شغّال على نفس الحزمة دلوقتي — استخدمه هو أو استنى شوية");
  }
  await storage.set("lock", { tab: LOCK.tab, ts: now });
  try {
    return await fn();
  } finally {
    var cur = await storage.get("lock");
    if (!cur || cur.tab === LOCK.tab) await storage.set("lock", { tab: LOCK.tab, ts: 0 });
  }
}
async function makeTxn(op, entityType, entityId, prev, next, payload) {
  if (ST.expired) {
    addNote("مرفوض (الرخصة منتهية)", op, entityId);
    throw new Error("فترة الطوارئ خلصت — مش ممكن تعمل عمليات جديدة. صدّر بياناتك وارفعها للنظام الأساسي.");
  }
  if (!ST.actor) { chooseActor(); throw new Error("اختار مين شغّال الأول"); }
  var fp = op + "|" + (entityId || "") + "|" + canonical(payload || {});
  var now = clockNow();
  if (RECENT[fp] && now - RECENT[fp] < 2000) {
    throw new Error("العملية دي اتعملت حالًا — مش هنكررها");
  }
  RECENT[fp] = now;
  var txn = {
    id: "ETX-" + uuid(),
    packageId: ST.license.packageId,
    centerId: ST.license.centerId,
    seq: ST.seq + 1,
    ts: new Date(now).toISOString(),
    actor: ST.actor.name,
    actorId: ST.actor.id,
    actorRole: ST.actor.role,
    op: op,
    entityType: entityType,
    entityId: entityId || null,
    prev: prev || null,
    next: next || null,
    payload: payload || null,
  };
  txn.sum = await sha256Hex(canonical(txn));
  ST.seq += 1;
  ST.txns.push(txn);
  if (bc) { try { bc.postMessage({ t: "txn", id: txn.id }); } catch (e) {} }
  return txn;
}
async function applyBalance(studentId, delta) {
  var before = ST.balances[studentId] || 0;
  ST.balances[studentId] = before + delta;
  return { before: before, after: ST.balances[studentId] };
}
async function persistState() {
  await storage.set("persisted", {
    sessions: ST.sessions,
    att: ST.att,
    balances: ST.balances,
    txns: ST.txns,
    notes: ST.notes,
    seq: ST.seq,
    studentsLocal: ST.studentsLocal,
    studentUpdates: ST.studentUpdates,
  });
}
async function reloadFromStorage() {
  var p = await storage.get("persisted");
  if (!p) return;
  importSnapshot();
  ST.sessions = p.sessions || [];
  ST.sessionsById = {};
  for (var i = 0; i < ST.sessions.length; i++) ST.sessionsById[ST.sessions[i].id] = ST.sessions[i];
  ST.att = p.att || {};
  ST.balances = p.balances || {};
  ST.txns = p.txns || [];
  ST.notes = p.notes || [];
  ST.seq = p.seq || 0;
  ST.studentsLocal = p.studentsLocal || [];
  ST.studentUpdates = p.studentUpdates || {};
  applyLocalStudents();
  if (ST.view) go(ST.view);
}

// ================= الحضور =================
async function setAttendance(sessionId, studentId, status) {
  return withLock(async function () {
    var key = sessionId + "|" + studentId;
    var existing = ST.att[key];
    var ses = sessionById(sessionId);
    if (!ses) throw new Error("الحصة مش موجودة");
    if (ses.status === "ENDED" || ses.status === "CANCELLED") throw new Error("الحصة " + (ses.status === "ENDED" ? "اتقفلت" : "اتلغت") + " — مش ممكن تسجّل فيها");
    var student = ST.studentsById[studentId];
    if (!student) throw new Error("الطالب مش موجود");
    var charge = status === "PRESENT" || status === "LATE" ? effectivePrice(student, ses.groupId) : 0;
    var at = new Date(clockNow()).toISOString();
    if (existing) {
      var oldCharge = existing.charged || 0;
      var bal = await applyBalance(studentId, oldCharge - charge); // فرق الخصم
      var txn = await makeTxn("ATTENDANCE_UPDATED", "ATTENDANCE", key, { status: existing.status, charged: oldCharge }, { status: status, charged: charge }, { sessionId: sessionId, studentId: studentId, charge: charge, sessionDate: ses.date });
      ST.att[key] = { sessionId: sessionId, studentId: studentId, status: status, charged: charge, at: at, txnId: txn.id, fromSnapshot: false };
      await applyBalancePersist();
      await persistState();
      return { txn: txn, balance: bal, updated: true };
    }
    var bal2 = await applyBalance(studentId, -charge);
    var txn2 = await makeTxn("ATTENDANCE_RECORDED", "ATTENDANCE", key, null, { status: status, charged: charge }, { sessionId: sessionId, studentId: studentId, charge: charge, sessionDate: ses.date });
    ST.att[key] = { sessionId: sessionId, studentId: studentId, status: status, charged: charge, at: at, txnId: txn2.id, fromSnapshot: false };
    await applyBalancePersist();
    await persistState();
    return { txn: txn2, balance: bal2, updated: false };
  });
}
async function applyBalancePersist() {
  await storage.set("balances", ST.balances);
}

// ================= الدفع =================
async function recordPayment(student, opts) {
  return withLock(async function () {
    var paid = Math.round(opts.amount);
    if (!Number.isFinite(paid) || paid <= 0) throw new Error("اكتب مبلغ أكبر من صفر");
    if (paid > 10000000) throw new Error("المبلغ كبير بشكل غير منطقي");
    var returned = Math.round(opts.changeReturned || 0);
    if (returned < 0 || returned > paid) throw new Error("الباقي مش منطقي");
    var ledger = paid - returned; // الباقي المرجوع كاش مش بيدخل المحفظة
    var bal = await applyBalance(student.id, ledger);
    var op = opts.kind === "RENEWAL" ? "SUBSCRIPTION_RENEWED" : "PAYMENT_RECORDED";
    var txn = await makeTxn(op, "STUDENT", student.id,
      { balance: bal.before },
      { balance: bal.after },
      {
        amount: ledger, paid: paid, changeReturned: returned,
        changeAction: returned > 0 ? "RETURNED" : "WALLET",
        method: opts.method || "CASH", sessionId: opts.sessionId || null,
        note: opts.note || null, balanceBefore: bal.before, balanceAfter: bal.after,
      });
    await applyBalancePersist();
    await persistState();
    return { txn: txn, balance: bal };
  });
}

// ================= الحصص =================
async function sessionStart(ses) {
  return withLock(async function () {
    if (ses.status === "ACTIVE") throw new Error("الحصة شغّالة خلاص");
    if (ses.status === "ENDED") throw new Error("الحصة دي اتقفلت — مش ممكن تتفتح تاني");
    var txn = await makeTxn("SESSION_STARTED", "SESSION", ses.id, { status: ses.status }, { status: "ACTIVE", actualStart: new Date(clockNow()).toISOString() }, { date: ses.date, groupId: ses.groupId, startTime: ses.startTime, reopened: ses.status === "CANCELLED" });
    ses.status = "ACTIVE";
    ses.actualStart = new Date(clockNow()).toISOString();
    await persistState();
    return txn;
  });
}
async function sessionEnd(ses) {
  return withLock(async function () {
    if (ses.status !== "ACTIVE") throw new Error("الحصة مش شغّالة");
    var present = 0, revenue = 0;
    for (var k in ST.att) {
      var a = ST.att[k];
      if (a.sessionId === ses.id && (a.status === "PRESENT" || a.status === "LATE")) {
        present++;
        revenue += a.charged || 0;
      }
    }
    var pct = ses.teacherPercent != null ? ses.teacherPercent : (ST.groupsById[ses.groupId] ? ST.groupsById[ses.groupId].teacherPercent : 50);
    var teacherShare = Math.round((revenue * pct) / 100);
    var centerShare = revenue - teacherShare;
    var txn = await makeTxn("SESSION_ENDED", "SESSION", ses.id,
      { status: "ACTIVE" },
      { status: "ENDED", presentCount: present, totalRevenue: revenue, teacherShare: teacherShare, centerShare: centerShare, actualEnd: new Date(clockNow()).toISOString() },
      { date: ses.date, groupId: ses.groupId, presentCount: present, totalRevenue: revenue, teacherShare: teacherShare, centerShare: centerShare });
    ses.status = "ENDED";
    ses.presentCount = present;
    ses.totalRevenue = revenue;
    ses.teacherShare = teacherShare;
    ses.centerShare = centerShare;
    ses.actualEnd = new Date(clockNow()).toISOString();
    await persistState();
    return { txn: txn, present: present, revenue: revenue, teacherShare: teacherShare, centerShare: centerShare };
  });
}
async function sessionCancel(ses) {
  return withLock(async function () {
    if (ses.status === "CANCELLED") throw new Error("الحصة ملغاة خلاص");
    if (ses.status === "ENDED") throw new Error("الحصة اتقفلت — مش ممكن تتلغى");
    var txn = await makeTxn("SESSION_CANCELLED", "SESSION", ses.id, { status: ses.status }, { status: "CANCELLED", at: new Date(clockNow()).toISOString() }, { date: ses.date, groupId: ses.groupId });
    ses.status = "CANCELLED";
    await persistState();
    return txn;
  });
}
async function manualSession(groupId, date, startTime, endTime, room) {
  return withLock(async function () {
    var g = ST.groupsById[groupId];
    if (!g) throw new Error("المجموعة مش موجودة");
    var id = "MS-" + uuid();
    var txn = await makeTxn("SESSION_STARTED", "SESSION", id, null, { status: "ACTIVE" }, { date: date, groupId: groupId, startTime: startTime, endTime: endTime, room: room, manual: true });
    var ses = { id: id, groupId: groupId, date: date, startTime: startTime, endTime: endTime, room: room || null, price: g.sessionPrice, teacherPercent: g.teacherPercent, status: "ACTIVE", actualStart: new Date(clockNow()).toISOString(), manual: true };
    ST.sessions.push(ses);
    ST.sessionsById[id] = ses;
    await persistState();
    return ses;
  });
}

// ================= الطلاب =================
function nextStudentCode() {
  var max = 10000;
  var used = {};
  for (var i = 0; i < ST.students.length; i++) used[ST.students[i].code] = true;
  var code = max;
  while (used[String(code)] && code < 99999) code++;
  return String(code);
}
async function addStudentLocal(data) {
  return withLock(async function () {
    if (!data.name || data.name.trim().length < 3) throw new Error("اكتب اسم الطالب كامل");
    var student = {
      id: "LS-" + uuid(),
      code: data.code || nextStudentCode(),
      qrToken: null, // محلي — يتعمل على السيرفر وقت الاستيراد
      name: data.name.trim(),
      phone: data.phone || null,
      parentPhone: data.parentPhone || null,
      gradeId: data.gradeId || null,
      status: "ACTIVE",
      createdAt: new Date(clockNow()).toISOString(),
      regs: data.groupId ? [{ groupId: data.groupId, priceOverride: null, since: new Date(clockNow()).toISOString() }] : [],
      local: true,
    };
    if (ST.studentsById[student.id]) throw new Error("خطأ داخلي — حاول تاني");
    ST.students.push(student);
    ST.studentsById[student.id] = student;
    ST.studentsLocal = ST.studentsLocal || [];
    ST.studentsLocal.push(student);
    ST.balances[student.id] = 0;
    var txn = await makeTxn("STUDENT_ADDED", "STUDENT", student.id, null, { name: student.name, code: student.code }, { name: student.name, code: student.code, phone: student.phone, parentPhone: student.parentPhone, gradeId: student.gradeId, groupId: data.groupId || null });
    await persistState();
    return { student: student, txn: txn };
  });
}
async function updateStudentLocal(student, changes) {
  return withLock(async function () {
    var prev = { phone: student.phone, parentPhone: student.parentPhone };
    if (changes.phone === student.phone && changes.parentPhone === student.parentPhone) throw new Error("مفيش تغيير");
    var txn = await makeTxn("STUDENT_UPDATED", "STUDENT", student.id, prev, changes, { phone: changes.phone, parentPhone: changes.parentPhone });
    student.phone = changes.phone;
    student.parentPhone = changes.parentPhone;
    ST.studentUpdates = ST.studentUpdates || {};
    ST.studentUpdates[student.id] = changes;
    await persistState();
    return txn;
  });
}

// ===== اختيار الحصة للحضور =====
function attendancePicker(s) {
  var today = todayStr();
  var mine = ST.sessions.filter(function (ses) {
    if (ses.date !== today || ses.status !== "ACTIVE") return false;
    return (s.regs || []).some(function (r) { return r.groupId === ses.groupId; });
  });
  var anyActive = ST.sessions.filter(function (ses) { return ses.date === today && ses.status === "ACTIVE"; });
  var options = mine.length ? mine : anyActive;
  if (options.length === 0) {
    toast("مفيش حصة شغّالة النهاردة لمجموعاته — افتحها من صفحة الحصص الأول", "err");
    go("sessions");
    return;
  }
  if (options.length === 1) { attendanceForSession(s, options[0]); return; }
  var body = openModal("اختار الحصة", s.name);
  var list = el("div");
  list.style.cssText = "display:flex;flex-direction:column;gap:8px";
  for (var i = 0; i < options.length; i++) {
    (function (ses) {
      var b = el("button", "nk-btn wide", icon("clock") + "<span>" + esc(groupLabel(ST.groupsById[ses.groupId])) + " · " + ses.startTime + "</span>");
      b.style.justifyContent = "flex-start";
      b.onclick = function () { attendanceForSession(s, ses); };
      list.appendChild(b);
    })(options[i]);
  }
  body.appendChild(list);
}
function attendanceForSession(s, ses) {
  var key = ses.id + "|" + s.id;
  var existing = ST.att[key];
  var price = effectivePrice(s, ses.groupId);
  var body = openModal(s.name, "حضور — " + groupLabel(ST.groupsById[ses.groupId]) + " · " + ses.startTime);
  var due = existing ? (existing.charged || 0) : amountDueToday(price, ST.balances[s.id] || 0);
  body.innerHTML =
    '<div class="nk-kv"><span class="k">سعر الحصة للطالب</span><span class="v mono">' + egp(price) + " ج</span></div>" +
    '<div class="nk-kv"><span class="k">الرصيد الحالي</span><span class="v mono">' + egpSigned(ST.balances[s.id] || 0) + " ج</span></div>" +
    (existing
      ? '<div class="nk-kv"><span class="k">حالته الحالية</span><span class="v">' + attBadge(existing.status) + " · خصم " + egp(existing.charged || 0) + " ج</span></div>"
      : '<div class="nk-kv"><span class="k">المطلوب لو حضر</span><span class="v mono">' + egp(due) + " ج</span></div>") +
    '<p class="nk-hint" style="margin:10px 0 8px">غيّر حالة الحضور (الخصم بيتظبط تلقائي):</p>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
      attBtn(s, ses, "PRESENT", "حاضر", existing) +
      attBtn(s, ses, "LATE", "متأخر", existing) +
      attBtn(s, ses, "EXCUSED", "بعذر", existing) +
      attBtn(s, ses, "ABSENT", "غياب", existing) +
    "</div>" +
    '<button class="nk-btn primary wide" id="att-and-pay" style="margin-top:10px">' + icon("wallet") + " حضور + دفع في خطوة</button>";
  document.getElementById("att-and-pay").onclick = function () { attendanceThenPay(s, ses, existing); };
}
function attBadge(status) {

  var m = map[status] || ["m", status];
  return '<span class="nk-badge ' + m[0] + '">' + m[1] + "</span>";

function attBtn(s, ses, status, label, existing) {

function bindAttButtons(s, ses, existing) {
  var body = document.getElementById("nk-modal-body");
  var btns = body.querySelectorAll("[data-att]");
  for (var i = 0; i < btns.length; i++) {

      b.onclick = async function () {

          renderStudentMainRefresh();
        } catch (e) { toast(e.message, "err"); }
        finally { busyBtn(b, false); }

}

  var btn = document.getElementById("att-and-pay");
  busyBtn(btn, true);
  try {
    var status = existing ? existing.status : "PRESENT";

      toast("اتسجّل الحضور", "ok");
    }
    paymentModal(s, { kind: "PAYMENT", sessionId: ses.id });
  } catch (e) { toast(e.message, "err"); }
  finally { busyBtn(btn, false); }
}

// ===== الدفع (مع الباقي) =====
function paymentModal(s, opts) {
  var kind = opts.kind || "PAYMENT";
  var price = 0;
  var regGroup = (s.regs || [])[0];
  if (regGroup) price = effectivePrice(s, regGroup.groupId);
  var due = amountDueToday(price, ST.balances[s.id] || 0);
  if (opts.sessionId) {
    var ses = sessionById(opts.sessionId);
    if (ses) { price = effectivePrice(s, ses.groupId); due = amountDueToday(price, ST.balances[s.id] || 0); }
  }
  var isRenew = kind === "RENEWAL";
  var suggest = isRenew ? price * 4 : due;
  var body = openModal(isRenew ? "تجديد اشتراك" : "دفعة — " + s.name, "كود " + s.code);

  body.innerHTML =
    '<div class="nk-kv"><span class="k">' + (isRenew ? "سعر الحصة" : "المطلوب") + '</span><span class="v mono">' + egp(isRenew ? price : due) + " ج" + (isRenew && price ? " × 4 حصص تقريبًا" : "") + "</span></div>" +
    '<div class="nk-kv"><span class="k">الرصيد الحالي</span><span class="v mono">' + egpSigned(ST.balances[s.id] || 0) + " ج</span></div>" +
    '<label class="nk-hint" style="display:block;margin:10px 0 6px">هيدفع كام؟ (بالجنيه)</label>' +
    '<input class="nk-input mono" id="pay-amt" inputmode="decimal" placeholder="0.00" value="' + (suggest > 0 ? egp(suggest).replace(/\.00$/, "") : "") + '">' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" id="pay-chips">' +
      (isRenew ? "" : '<button class="nk-chip" data-amt="' + (due / 100) + '">المطلوب (' + egp(due) + ")</button>") +
      (isRenew ? '<button class="nk-chip gold" data-amt="' + (price * 4 / 100) + '">شهر (4 حصص)</button>' + '<button class="nk-chip" data-amt="' + (price * 8 / 100) + '">شهرين</button>' : "") +
      '<button class="nk-chip" data-amt="50">50</button>' +
      '<button class="nk-chip" data-amt="100">100</button>' +
      '<button class="nk-chip" data-amt="200">200</button>' +
    "</div>" +
    '<label class="nk-hint" style="display:block;margin:12px 0 6px">طريقة الدفع</label>' +
    '<div style="display:flex;gap:6px" id="pay-methods">' +
      '<button class="nk-chip on" data-m="CASH">كاش</button>' +
      '<button class="nk-chip" data-m="VODAFONE">فودافون كاش</button>' +
      '<button class="nk-chip" data-m="INSTAPAY">انستاباي</button>' +
    "</div>" +
    '<div id="pay-change-box" style="margin-top:12px"></div>' +
    '<button class="nk-btn primary wide" id="pay-go" style="margin-top:12px">' + icon("check") + (isRenew ? " سجّل التجديد" : " سجّل الدفعة") + "</button>" +
    '<button class="nk-btn wide" id="pay-skip" style="margin-top:8px">مش هيدفع دلوقتي</button>';

  var state = { method: "CASH", changeAction: "WALLET" };
  var amt = document.getElementById("pay-amt");
  var changeBox = document.getElementById("pay-change-box");
  var methodBox = document.getElementById("pay-methods");

  methodBox.querySelectorAll("[data-m]").forEach?.(function () {});
  var mBtns = methodBox.querySelectorAll("[data-m]");
  for (var mi = 0; mi < mBtns.length; mi++) {
    (function (b) {
      b.onclick = function () {
        state.method = b.getAttribute("data-m");
        for (var j = 0; j < mBtns.length; j++) mBtns[j].classList.remove("on");
        b.classList.add("on");
      };
    })(mBtns[mi]);
  }
  var chips = document.getElementById("pay-chips").querySelectorAll("[data-amt]");
  for (var ci = 0; ci < chips.length; ci++) {
    (function (b) {
      b.onclick = function () {
        amt.value = b.getAttribute("data-amt");
        refreshChange();
      };
    })(chips[ci]);
  }
  function paidPiastres() { return Math.round(parseFloat(normDigits(amt.value).replace(/,/g, "")) * 100) || 0; }
  function refreshChange() {
    var paid = paidPiastres();
    var over = paid - due;
    if (isRenew) over = 0;
    if (over > 0 && changeBox) {
      changeBox.innerHTML =
        '<div class="nk-card" style="box-shadow:none;background:var(--gold-soft);border-color:#EBD9AC">' +
          '<p style="margin:0 0 8px;font-weight:800;font-size:13px">الباقي <span class="mono">' + egp(over) + "</span> ج — يعمل بيه إيه؟</p>" +
          '<div style="display:flex;gap:6px">' +
            '<button class="nk-btn sm' + (state.changeAction === "RETURNED" ? " primary" : "") + '" data-ch="RETURNED">رجّع الباقي كاش</button>' +
            '<button class="nk-btn sm' + (state.changeAction === "WALLET" ? " primary" : "") + '" data-ch="WALLET">حطّه في المحفظة</button>' +
          "</div>" +
        "</div>";
      var chBtns = changeBox.querySelectorAll("[data-ch]");
      for (var i = 0; i < chBtns.length; i++) {
        (function (b) {
          b.onclick = function () {
            state.changeAction = b.getAttribute("data-ch");
            refreshChange();
          };
        })(chBtns[i]);
      }
    } else changeBox.innerHTML = "";
  }
  amt.oninput = refreshChange;
  refreshChange();

  document.getElementById("pay-go").onclick = async function () {
    var btn = this;
    busyBtn(btn, true);
    try {
      var paid = paidPiastres();
      if (paid <= 0) throw new Error("اكتب المبلغ الأول");
      var returned = 0;
      if (!isRenew) {
        var over = paid - due;
        if (over > 0 && state.changeAction === "RETURNED") returned = over;
      }
      var res = await recordPayment(s, {
        amount: paid, changeReturned: returned, method: state.method,
        sessionId: opts.sessionId || null,
        note: isRenew ? "تجديد اشتراك (طوارئ)" : (opts.sessionId ? "دفع وقت الحضور (طوارئ)" : null),
        kind: kind,
      });
      var newBal = res.balance.after;
      body.innerHTML =
        '<div class="nk-status-hero ok">' +
          '<div style="font-size:40px">✅</div>' +
          '<p style="margin:6px 0 2px;font-weight:800;font-size:16px">' + (isRenew ? "اتسجّل التجديد" : "اتسجّلت الدفعة") + " — " + egp(res.txn.payload.amount) + " ج (" + (state.method === "CASH" ? "كاش" : state.method === "VODAFONE" ? "فودافون" : "انستاباي") + ")</p>" +
          (returned > 0 ? '<p style="margin:2px 0;font-weight:700;color:var(--gold-deep)">الباقي ' + egp(returned) + " ج رجع كاش</p>" : paid - due > 0 && !isRenew ? '<p style="margin:2px 0;font-weight:700;color:#16A34A">الباقي ' + egp(paid - due - returned) + " ج اتحط في المحفظة</p>" : "") +
          '<p class="mono" style="margin:6px 0 0;font-weight:800;font-size:15px">الرصيد دلوقتي: ' + egpSigned(newBal) + " ج</p>" +
          '<p class="mono nk-hint" style="margin:4px 0 0" dir="ltr">' + res.txn.id + "</p>" +
        "</div>" +
        '<button class="nk-btn primary wide" id="pay-done" style="margin-top:12px">جاهز للطالب الجاي</button>';
      document.getElementById("pay-done").onclick = function () { closeModal(); };
      renderDashboardQuiet();
    } catch (e) {
      toast(e.message, "err");
      busyBtn(btn, false);
    }
  };
  document.getElementById("pay-skip").onclick = function () {
    closeModal();
    renderStudentMain(s, document.getElementById("nk-modal-body") || openModal(s.name, "كود " + s.code));
  };
}
function renderDashboardQuiet() { if (ST.view === "dash") renderDashboard(); else if (ST.view === "txns") renderTxns(); }

// ===== تسوية الرصيد =====
function adjustModal(s) {
  var body = openModal("تسوية رصيد — " + s.name, "الرصيد الحالي: " + egpSigned(ST.balances[s.id] || 0) + " ج");
  body.innerHTML =
    '<label class="nk-hint" style="display:block;margin-bottom:6px">المبلغ (بالجنيه — بالسالب لو خصم/تصحيح دين)</label>' +
    '<input class="nk-input mono" id="adj-amt" inputmode="decimal" placeholder="0.00">' +
    '<label class="nk-hint" style="display:block;margin:10px 0 6px">السبب</label>' +
    '<input class="nk-input" id="adj-reason" placeholder="مثال: تصحيح رصيد / خصم / إضافة رصيد">' +
    '<button class="nk-btn primary wide" id="adj-go" style="margin-top:12px">' + icon("check") + " سجّل التسوية</button>";
  document.getElementById("adj-go").onclick = async function () {
    var btn = this;
    busyBtn(btn, true);
    try {
      var amount = Math.round(parseFloat(normDigits(document.getElementById("adj-amt").value)) * 100) || 0;
      if (amount === 0) throw new Error("اكتب مبلغ مش صفر");
      var reason = document.getElementById("adj-reason").value.trim() || "تسوية طوارئ";
      var bal = await applyBalance(s.id, amount);
      var txn = await makeTxn("BALANCE_UPDATED", "STUDENT", s.id, { balance: bal.before }, { balance: bal.after }, { amount: amount, reason: reason, balanceBefore: bal.before, balanceAfter: bal.after });
      await persistState();
      toast("اتسجلت التسوية — الرصيد " + egpSigned(bal.after) + " ج", "ok");
      closeModal();
      openStudent(s.id);
    } catch (e) { toast(e.message, "err"); busyBtn(btn, false); }
  };
}

// ===== الاشتراكات =====
function subsModal(s) {
  var body = openModal("اشتراكات — " + s.name, "كود " + s.code);
  var rows = "";
  (s.regs || []).forEach(function (r) {
    var g = ST.groupsById[r.groupId];
    if (!g) return;
    var price = r.priceOverride != null ? r.priceOverride : g.sessionPrice;
    var used = 0;
    for (var k in ST.att) {
      var a = ST.att[k];
      var ses = sessionById(a.sessionId);
      if (ses && ses.groupId === r.groupId && (a.status === "PRESENT" || a.status === "LATE")) used++;
    }
    var paidTotal = 0;
    for (var t = 0; t < ST.txns.length; t++) {
      var tx = ST.txns[t];
      if (tx.entityId === s.id && (tx.op === "PAYMENT_RECORDED" || tx.op === "SUBSCRIPTION_RENEWED")) paidTotal += tx.payload.amount || 0;
    }
    rows +=
      '<div class="nk-card" style="box-shadow:none;margin-bottom:10px">' +
        '<p style="margin:0 0 4px;font-weight:800;color:var(--navy)">' + esc(groupLabel(g)) + "</p>" +
        '<div class="nk-kv"><span class="k">سعر الحصة</span><span class="v mono">' + egp(price) + " ج</span></div>" +
        '<div class="nk-kv"><span class="k">تاريخ التسجيل</span><span class="v">' + fmtDateAr(r.since) + "</span></div>" +
        '<div class="nk-kv"><span class="k">حصص اتعملت (لقطة + طوارئ)</span><span class="v mono">' + used + "</span></div>" +
        '<div class="nk-kv"><span class="k">إجمالي مدفوع (طوارئ)</span><span class="v mono">' + egp(paidTotal) + " ج</span></div>" +
        '<div class="nk-kv"><span class="k">الرصيد الحالي</span><span class="v mono">' + egpSigned(ST.balances[s.id] || 0) + " ج</span></div>" +
        '<div class="nk-kv"><span class="k">الحالة</span><span class="v">' + (ST.balances[s.id] || 0) >= 0 ? '<span class="nk-badge g">نشط</span>' : '<span class="nk-badge o">عليه ' + egp(-(ST.balances[s.id] || 0)) + ' ج</span>' + "</span></div>" +
      "</div>";
  });
  body.innerHTML = rows || '<div class="nk-empty"><div class="big">📚</div>الطالب مش مسجّل في مجموعات — سجّله من النظام الأساسي أو هنا لو جديد</div>';
}

// ===== تعديل بيانات التواصل =====
function editStudentModal(s) {
  var body = openModal("تعديل بيانات — " + s.name, "بيانات التواصل بس (الاسم والكود بيتغيروا من النظام الأساسي)");
  body.innerHTML =
    '<label class="nk-hint" style="display:block;margin-bottom:6px">موبايل الطالب</label>' +
    '<input class="nk-input mono" id="ed-phone" value="' + esc(s.phone || "") + '" inputmode="tel">' +
    '<label class="nk-hint" style="display:block;margin:10px 0 6px">موبايل ولي الأمر</label>' +
    '<input class="nk-input mono" id="ed-parent" value="' + esc(s.parentPhone || "") + '" inputmode="tel">' +
    '<button class="nk-btn primary wide" id="ed-go" style="margin-top:12px">' + icon("check") + " احفظ</button>";
  document.getElementById("ed-go").onclick = async function () {
    busyBtn(this, true);
    try {
      var changes = { phone: document.getElementById("ed-phone").value.trim() || null, parentPhone: document.getElementById("ed-parent").value.trim() || null };
      await updateStudentLocal(s, changes);
      toast("اتحفظ — هيتزامن مع النظام الأساسي", "ok");
      closeModal();
      openStudent(s.id);
    } catch (e) { toast(e.message, "err"); busyBtn(this, false); }
  };
}

// ===== طالب جديد =====
function addStudentModal() {
  var body = openModal("طالب جديد", "بيتسجّل محليًا في الطوارئ — ويتزامن وقت الاستيراد");
  var gradeOpts = ST.grades.map(function (g) { return '<option value="' + esc(g.id) + '">' + esc(g.name) + "</option>"; }).join("");
  var groupOpts = '<option value="">— من غير مجموعة —</option>' + ST.groups.filter(function (g) { return g.isActive; }).map(function (g) { return '<option value="' + esc(g.id) + '">' + esc(groupLabel(g)) + " (" + egp(g.sessionPrice) + ' ج)</option>'; }).join("");
  body.innerHTML =
    '<label class="nk-hint" style="display:block;margin-bottom:6px">الاسم *</label>' +
    '<input class="nk-input" id="ns-name" placeholder="الاسم رباعي">' +
    '<label class="nk-hint" style="display:block;margin:10px 0 6px">الموبايل</label>' +
    '<input class="nk-input mono" id="ns-phone" inputmode="tel">' +
    '<label class="nk-hint" style="display:block;margin:10px 0 6px">موبايل ولي الأمر</label>' +
    '<input class="nk-input mono" id="ns-parent" inputmode="tel">' +
    '<label class="nk-hint" style="display:block;margin:10px 0 6px">المرحلة</label>' +
    '<select class="nk-input" id="ns-grade"><option value="">—</option>' + gradeOpts + "</select>" +
    '<label class="nk-hint" style="display:block;margin:10px 0 6px">المجموعة</label>' +
    '<select class="nk-input" id="ns-group">' + groupOpts + "</select>" +
    '<button class="nk-btn primary wide" id="ns-go" style="margin-top:12px">' + icon("plus") + " سجّل الطالب</button>";
  document.getElementById("ns-go").onclick = async function () {
    busyBtn(this, true);
    try {
      var data = {
        name: document.getElementById("ns-name").value.trim(),
        phone: document.getElementById("ns-phone").value.trim() || null,
        parentPhone: document.getElementById("ns-parent").value.trim() || null,
        gradeId: document.getElementById("ns-grade").value || null,
        groupId: document.getElementById("ns-group").value || null,
      };
      var res = await addStudentLocal(data);
      toast("اتسجّل " + res.student.name + " — كود " + res.student.code, "ok");
      closeModal();
      openStudent(res.student.id);
    } catch (e) { toast(e.message, "err"); busyBtn(this, false); }
  };
}
</script>
<script>
"use strict";

// ================= صفحة الحصص =================
var SES_FILTER = "ALL";
function renderSessions() {
  var main = document.getElementById("nk-main");
  if (!ST.sessionDate) ST.sessionDate = todayStr();
  var issuedDate = ST.license.issuedAt.slice(0, 10);
  var expireDate = ST.license.expiresAt.slice(0, 10);

  var days = [];
  var start = issuedDate > todayStr() ? issuedDate : todayStr();
  // شريط أيام: النهاردة ± أيام الرخصة (داخل النافذة)
  for (var d = -1; d <= 6; d++) {
    var ds = addDays(start, d);
    if (ds < issuedDate || ds > expireDate) continue;
    days.push(ds);
  }

  var strip = "";
  for (var i = 0; i < days.length; i++) {
    var on = days[i] === ST.sessionDate;
    strip += '<button class="nk-day' + (on ? " on" : "") + (days[i] === todayStr() ? " today" : "") + '" data-date="' + days[i] + '"><b>' + dayNameAR(days[i]) + "</b><span class='mono'>" + days[i].slice(5) + "</span></button>";
  }

  main.innerHTML =
    '<div class="nk-card brand" style="margin-bottom:12px">' +
      '<h2 class="nk-sec-title">الحصص</h2>' +
      '<p class="nk-sec-sub">مواعيد الحصة مش بتفتحها لوحدها — لازم تضغط «ابدأ الحصة» · الحصص المتزامنة مدعومة</p>' +
      '<div class="nk-days-strip">' + strip + "</div>" +
      '<div class="nk-row">' +
        '<input type="date" class="nk-input" id="ses-date" value="' + ST.sessionDate + '" style="max-width:190px" min="' + issuedDate + '" max="' + expireDate + '">' +
        '<button class="nk-btn sm" id="ses-manual">' + icon("plus", 14) + " حصة يدوية</button>" +
        '<div style="flex:1"></div>' +
        '<select class="nk-input" id="ses-filter" style="max-width:160px;padding:8px 10px;min-height:40px">' +
          '<option value="ALL">كل الحالات</option>' +
          '<option value="SCHEDULED">المجدولة</option>' +
          '<option value="ACTIVE">شغّالة</option>' +
          '<option value="ENDED">خلصت</option>' +
          '<option value="CANCELLED">ملغاة</option>' +
        "</select>" +
      "</div>" +
    "</div>" +
    '<div id="ses-list" style="display:flex;flex-direction:column;gap:8px"></div>';

  var stripBtns = main.querySelectorAll("[data-date]");
  for (var sb = 0; sb < stripBtns.length; sb++) {
    (function (b) {
      b.onclick = function () {
        ST.sessionDate = b.getAttribute("data-date");
        renderSessions();
      };
    })(stripBtns[sb]);
  }
  document.getElementById("ses-date").onchange = function () {
    ST.sessionDate = this.value || todayStr();
    renderSessions();
  };
  document.getElementById("ses-filter").value = SES_FILTER;
  document.getElementById("ses-filter").onchange = function () {
    SES_FILTER = this.value;
    renderSessions();
  };
  document.getElementById("ses-manual").onclick = manualSessionModal;
  renderSessionList();
}
function renderSessionList() {
  var list = document.getElementById("ses-list");
  if (!list) return;
  var date = ST.sessionDate;
  var sessions = ST.sessions.filter(function (s) { return s.date === date; });
  sessions.sort(function (a, b) { return a.startTime < b.startTime ? -1 : 1; });
  if (SES_FILTER !== "ALL") sessions = sessions.filter(function (s) { return s.status === SES_FILTER; });
  list.innerHTML = "";
  if (sessions.length === 0) {
    list.innerHTML = '<div class="nk-empty"><div class="big">📭</div>مفيش حصص في اليوم ده</div>';
    return;
  }
  for (var i = 0; i < sessions.length; i++) list.appendChild(sessionRow(sessions[i]));
}
function sesBadge(status) {
  var map = {
    SCHEDULED: ["m", "مجدولة"],
    ACTIVE: ["g", "شغّالة"],
    ENDED: ["n", "خلصت"],
    CANCELLED: ["r", "ملغاة"],
  };
  var m = map[status] || ["m", status];
  return '<span class="nk-badge ' + m[0] + '">' + m[1] + "</span>";
}
function sessionRow(ses) {
  var g = ST.groupsById[ses.groupId];
  var live = ses.status === "ACTIVE";
  var attCount = 0;
  for (var k in ST.att) {
    var a = ST.att[k];
    if (a.sessionId === ses.id && (a.status === "PRESENT" || a.status === "LATE")) attCount++;
  }
  var card = el("div", "nk-ses" + (live ? " live" : ""),
    '<div class="tm mono">' + esc(ses.startTime) + "<small>" + esc(ses.endTime || "") + "</small></div>" +
    '<div class="info"><b>' + esc(groupLabel(g)) + "</b><span>" + esc(teacherName(g ? g.teacherId : null)) + (ses.room ? " · " + esc(ses.room) : "") +
      (ses.manual ? " · يدوية" : "") + (ses.status === "ENDED" && ses.presentCount != null ? " · حضور " + ses.presentCount + " · إيراد " + egp(ses.totalRevenue || 0) + " ج" : "") +
    "</span></div>" +
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">' + sesBadge(ses.status) +
      (attCount && live ? '<span class="nk-badge a mono">' + attCount + " حاضر</span>" : "") +
    "</div>");

  var actions = el("div");
  actions.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:8px;border-top:1px dashed var(--border);margin-top:8px";
  if (ses.status === "SCHEDULED" || ses.status === "CANCELLED") {
    var bStart = el("button", "nk-btn sm primary", icon("play", 14) + (ses.status === "CANCELLED" ? " افتحها تاني" : " ابدأ الحصة"));
    bStart.onclick = async function () {
      busyBtn(this, true);
      try { await sessionStart(ses); toast("الحصة بدأت", "ok"); renderSessionList(); }
      catch (e) { toast(e.message, "err"); busyBtn(this, false); }
    };
    actions.appendChild(bStart);
  }
  if (ses.status === "ACTIVE") {
    var bAtt = el("button", "nk-btn sm", icon("users", 14) + " الحضور (" + attCount + ")");
    bAtt.onclick = function () { attendanceModal(ses); };
    var bEnd = el("button", "nk-btn sm ghost-ok", icon("stop", 14) + " قفل الحصة");
    bEnd.onclick = async function () {
      busyBtn(this, true);
      try {
        var res = await sessionEnd(ses);
        toast("اتقفلت — حضور " + res.present + " · إيراد " + egp(res.revenue) + " ج · نصيب المدرس " + egp(res.teacherShare) + " ج", "ok");
        renderSessionList();
      } catch (e) { toast(e.message, "err"); busyBtn(this, false); }
    };
    actions.appendChild(bAtt);
    actions.appendChild(bEnd);
  }
  if (ses.status === "ENDED") {
    var bView = el("button", "nk-btn sm", icon("users", 14) + " الحضور (" + (ses.presentCount != null ? ses.presentCount : attCount) + ")");
    bView.onclick = function () { attendanceModal(ses); };
    actions.appendChild(bView);
  }
  if (ses.status === "SCHEDULED" || ses.status === "ACTIVE") {
    var bCancel = el("button", "nk-btn sm danger", icon("ban", 14) + " إلغاء");
    bCancel.onclick = async function () {
      if (!confirm("تلغي الحصة دي؟")) return;
      busyBtn(this, true);
      try { await sessionCancel(ses); toast("اتلغت الحصة", "ok"); renderSessionList(); }
      catch (e) { toast(e.message, "err"); busyBtn(this, false); }
    };
    actions.appendChild(bCancel);
  }
  card.appendChild(actions);
  return card;
}
function manualSessionModal() {

function safeName(s) {
  return String(s || "CENTER").replace(/[\\/:*?"<>|\x00-\x1F]/g, "").replace(/\s+/g, "-").slice(0, 40) || "CENTER";
}
function downloadBlob(data, mime, name) {
  var blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1200);
}
